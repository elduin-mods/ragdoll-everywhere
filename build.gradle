plugins { id 'fabric-loom' version '1.8.13'; id 'maven-publish' }
version = '0.1.0'
group = 'labs.elduin'
base { archivesName = 'ragdoll-everywhere' }
repositories { mavenCentral() }
dependencies {
 minecraft 'com.mojang:minecraft:1.21.3'
 mappings 'net.fabricmc:yarn:1.21.3+build.2:v2'
 modImplementation 'net.fabricmc:fabric-loader:0.16.9'
 modImplementation 'net.fabricmc.fabric-api:fabric-api:0.107.0+1.21.3'
}
java { toolchain { languageVersion = JavaLanguageVersion.of(21) }; withSourcesJar() }
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand 'version': project.version } }
